<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>Oxygen Tree Calculator</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #f4f9f4; text-align: center; }
        .calc-box { max-width: 400px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0px 0px 10px rgba(0,0,0,0.1); }
        input { width: 80%; padding: 10px; margin: 10px 0; font-size: 16px; border: 1px solid #ccc; border-radius: 4px; }
        button { background: #2e7d32; color: white; border: none; padding: 10px 20px; font-size: 16px; cursor: pointer; border-radius: 4px; }
        .result { margin-top: 20px; text-align: left; font-size: 16px; line-height: 1.6; }
    </style>
</head>
<body>

<div class="calc-box">
    <h2>🌳 ऑक्सीजन और पेड़ कैलकुलेटर</h2>
    <p>आपके परिवार को कितने पेड़ों की जरूरत है?</p>
    <input type="number" id="peopleInput" placeholder="लोगों की संख्या दर्ज करें" min="1">
    <br>
    <button onclick="calculateTrees()">हिसाब लगाएं</button>

    <div class="result" id="output" style="display:none;">
        <p>📊 **नतीजा:**</p>
        <p>• कुल दैनिक ऑक्सीजन जरूरत: <strong id="totalO2">0</strong> लीटर</p>
        <p>• सांस लेने के लिए आवश्यक बड़े पेड़: <strong id="treesO2">0</strong> पेड़</p>
        <p>• छोड़ी गई CO₂ सोखने के लिए आवश्यक पेड़: <strong id="treesCO2">0</strong> पेड़</p>
    </div>
</div>

<script>
function calculateTrees() {
    let people = document.getElementById("peopleInput").value;
    if(people <= 0 || people == "") { alert("कृपया सही संख्या दर्ज करें"); return; }
    
    let totalO2 = people * 550;
    let treesO2 = Math.ceil(totalO2 / 250);
    let treesCO2 = Math.ceil(people / 0.06);
    
    document.getElementById("totalO2").innerText = totalO2;
    document.getElementById("treesO2").innerText = treesO2;
    document.getElementById("treesCO2").innerText = treesCO2;
    document.getElementById("output").style.display = "block";
}
</script>

</body>
</html>
